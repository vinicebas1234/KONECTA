[pytest]
# Os scripts em tests/ foram escritos como smoke tests standalone (função
# main() + `python tests/arquivo.py`), sem nenhuma função `test_*`. Sem esta
# configuração, `pytest tests/` coleta 0 testes silenciosamente (exit code 5).
# Registrando `main` como uma função de teste valida, o pytest passa a
# executar e reportar corretamente os 12 smoke tests existentes.
testpaths = tests
python_files = test_*.py
python_functions = main test_*
