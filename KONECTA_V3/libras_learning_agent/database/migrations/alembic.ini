# Alembic config — Libras Learning Agent (independente do app_backend)
# Rodar a partir da raiz do KONECTA_V3:
#   alembic -c libras_learning_agent/database/migrations/alembic.ini upgrade head

[alembic]
# %(here)s = diretório deste .ini (database/migrations/), independente do cwd
# de onde `alembic` é chamado.
script_location = %(here)s
version_path_separator = os

sqlalchemy.url = sqlite:///./libras_learning_agent/data/agent.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
